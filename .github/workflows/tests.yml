name: Lua-Flash tests
on:
  push:
  pull_request:
jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Syntax check
        run: find . -type f -name '*.lua' -print0 | xargs -0 -n 1 luac -p
      - name: Model and player tests
        run: lua tests/model_test.lua
