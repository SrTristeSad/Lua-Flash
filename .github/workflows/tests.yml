name: Lua-Flash tests
on:
  push:
  pull_request:
jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4 love xvfb
      - name: Syntax check
        run: find . -type f -name '*.lua' -print0 | xargs -0 -n 1 luac -p
      - name: Shared model and renderer
        run: python3 tools/sync_core.py --check
      - name: Model and player tests
        run: lua tests/model_test.lua
      - name: Player 0.2 transport and interpolation
        run: lua tests/player_test.lua
      - name: Player 0.3 events and minigame tests
        run: lua tests/input_test.lua
      - name: Player 0.4 safe game package tests
        run: lua tests/package_test.lua
      - name: Player 0.5 named objects and game states
        run: lua tests/package_v2_test.lua
      - name: Player 0.6 object identity and collision tests
        run: lua tests/package_v3_test.lua
      - name: Player 0.7 media package and audio tests
        run: lua tests/package_v4_test.lua
      - name: Player 0.8 interactive sprite tests
        run: lua tests/package_v5_test.lua
      - name: Player 0.9 animated sprites and timeline audio
        run: lua tests/package_v6_test.lua
      - name: Player 0.10 alpha mask and frame cache tests
        run: lua tests/pixel_mask_test.lua
      - name: Player 0.11 fast motion collision and loop tests
        run: lua tests/swept_collision_test.lua
      - name: Player 0.12 transform and alpha collision tests
        run: lua tests/package_v7_test.lua
      - name: Player 0.13 keyframed sprite transform tests
        run: lua tests/package_v8_test.lua
      - name: Player 0.14 easing curves and package compatibility
        run: lua tests/package_v9_test.lua
      - name: Player 0.15 keyframe editing and safety tests
        run: lua tests/keyframe_editor_test.lua
      - name: Player 0.16 edit history, safety and rotation tests
        run: lua tests/edit_history_test.lua
      - name: Player 0.17 integrity recovery and runtime diagnostics
        run: lua tests/recovery_test.lua
      - name: Player 0.18 local failure logging
        run: lua tests/error_report_test.lua
      - name: Player 0.18 larger-scene stress and interpolation regression
        run: lua tests/stress_player_test.lua
      - name: Player 0.19 audio voice pool and independent channel tests
        run: lua tests/audio_mixer_test.lua
      - name: Player and Studio interface smoke tests
        run: lua tests/gui_smoke.lua
      - name: Real LÖVE graphical/media smoke test (virtual display)
        run: xvfb-run -a env SDL_AUDIODRIVER=dummy LIBGL_ALWAYS_SOFTWARE=1 LUA_FLASH_SMOKE=1 LUA_FLASH_SMOKE_MEDIA=1 timeout 30s love player-lua
      - name: Package standalone Player .love and example .lfgame
        run: |
          python3 tools/package_player.py
          lua tools/export_example.lua dist/Exemplo-0.19.lfgame
          lua -e 'package.path="./player-lua/?.lua;"..package.path; local d=require("src.demo").create(); local f=assert(io.open("dist/cena-teste.lflash","wb")); assert(f:write(require("src.model").encode(d))); assert(f:close())'
          lua tools/make_game.lua dist/cena-teste.lflash dist/Criado-0.19.lfgame 2 1 5 20 smooth
          lua -e 'package.path="./player-lua/?.lua;"..package.path; local f=assert(io.open("dist/Criado-0.19.lfgame","rb")); local g=assert(require("src.package_v3").decode(f:read("*a"))); f:close(); assert(g.version==3 and g.goal==5 and g.duration==20 and #g.rules==1 and #g.bindings>0)'
          python3 tools/generate_media_fixtures.py --directory dist
          lua tools/attach_media.lua dist/Criado-0.19.lfgame dist/Com-Midia-0.19.lfgame dist/icone-original.png 660 270 64 64 dist/efeito-original.wav CLICKID alvo
          lua -e 'package.path="./player-lua/?.lua;"..package.path; local f=assert(io.open("dist/Com-Midia-0.19.lfgame","rb")); local game=assert(require("src.package_v4").decode(f:read("*a"))); f:close(); assert(game.version==4 and #game.resources==2 and #game.cues==1 and #game.sprites==1)'
          lua tools/bind_sprite.lua dist/Com-Midia-0.19.lfgame dist/Com-Sprite-0.19.lfgame 1 alvo FOLLOW
          lua -e 'package.path="./player-lua/?.lua;"..package.path; local f=assert(io.open("dist/Com-Sprite-0.19.lfgame","rb")); local game=assert(require("src.package_v5").decode(f:read("*a"))); f:close(); assert(game.version==5 and #game.spriteBindings==1 and game.spriteBindings[1].id=="alvo")'
          lua tools/animate_media.lua dist/Com-Sprite-0.19.lfgame dist/Animado-0.19.lfgame 1 7 dist/icone-original.png som_1 23
          lua -e 'package.path="./player-lua/?.lua;"..package.path; local f=assert(io.open("dist/Animado-0.19.lfgame","rb")); local g=assert(require("src.package_v6").decode(f:read("*a"))); f:close(); assert(g.version==6 and #g.animations==1 and #g.timelineSounds==1)'
          lua tools/transform_sprite.lua dist/Animado-0.19.lfgame dist/Transformado-0.19.lfgame 1 45 130 130 50 50
          lua -e 'package.path="./player-lua/?.lua;"..package.path; local f=assert(io.open("dist/Transformado-0.19.lfgame","rb")); local g=assert(require("src.package_v7").decode(f:read("*a"))); f:close(); assert(g.version==7 and #g.transforms==1 and g.transforms[1].angle==45)'
          lua tools/animate_transform.lua dist/Transformado-0.19.lfgame dist/Com-Keyframes-0.19.lfgame 1 1,0,0,0,100,100 23,30,-45,90,150,85 45,-20,30,180,75,150 90,0,0,360,100,100
          lua -e 'package.path="./player-lua/?.lua;"..package.path; local f=assert(io.open("dist/Com-Keyframes-0.19.lfgame","rb")); local g=assert(require("src.package_v8").decode(f:read("*a"))); f:close(); assert(g.version==8 and #g.tweens==1 and #g.tweens[1].keys==4)'
          lua tools/set_easing.lua dist/Com-Keyframes-0.19.lfgame dist/Com-Easing-0.19.lfgame 1 1 EASE_IN_OUT
          lua -e 'package.path="./player-lua/?.lua;"..package.path; local f=assert(io.open("dist/Com-Easing-0.19.lfgame","rb")); local g=assert(require("src.package_v9").decode(f:read("*a"))); f:close(); assert(g.version==9 and #g.easings==1 and g.easings[1].mode=="EASE_IN_OUT")'
      - name: Upload Player test build
        uses: actions/upload-artifact@v4
        with:
          name: lua-flash-player-0.19-love-and-game
          path: |
            dist/Lua-Flash-Player-0.19.love
            dist/Exemplo-0.19.lfgame
            dist/Criado-0.19.lfgame
            dist/Com-Midia-0.19.lfgame
            dist/Com-Sprite-0.19.lfgame
            dist/Animado-0.19.lfgame
            dist/Transformado-0.19.lfgame
            dist/Com-Keyframes-0.19.lfgame
            dist/Com-Easing-0.19.lfgame
            dist/icone-original.png
            dist/efeito-original.wav
          if-no-files-found: error
