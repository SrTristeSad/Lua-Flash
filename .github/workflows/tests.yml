name: Lua-Flash tests
on:
  push:
  pull_request:
jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4 love xvfb
      - name: Syntax check
        run: find . -type f -name '*.lua' -print0 | xargs -0 -n 1 luac -p
      - name: Shared model and renderer
        run: python3 tools/sync_core.py --check
      - name: Model and player tests
        run: lua tests/model_test.lua
      - name: Player 0.2 transport and interpolation
        run: lua tests/player_test.lua
      - name: Player 0.3 events and minigame tests
        run: lua tests/input_test.lua
      - name: Player 0.4 safe game package tests
        run: lua tests/package_test.lua
      - name: Player 0.5 named objects and game states
        run: lua tests/package_v2_test.lua
      - name: Player 0.6 object identity and collision tests
        run: lua tests/package_v3_test.lua
      - name: Player 0.7 media package and audio tests
        run: lua tests/package_v4_test.lua
      - name: Player 0.8 interactive sprite tests
        run: lua tests/package_v5_test.lua
      - name: Player 0.9 animated sprites and timeline audio
        run: lua tests/package_v6_test.lua
      - name: Player 0.10 alpha mask and frame cache tests
        run: lua tests/pixel_mask_test.lua
      - name: Player 0.11 fast motion collision and loop tests
        run: lua tests/swept_collision_test.lua
      - name: Player 0.12 transform and alpha collision tests
        run: lua tests/package_v7_test.lua
      - name: Player 0.13 keyframed sprite transform tests
        run: lua tests/package_v8_test.lua
      - name: Player 0.14 easing curves and package compatibility
        run: lua tests/package_v9_test.lua
      - name: Player 0.15 keyframe editing and safety tests
        run: lua tests/keyframe_editor_test.lua
      - name: Player 0.16 edit history, safety and rotation tests
        run: lua tests/edit_history_test.lua
      - name: Player 0.17 integrity recovery and runtime diagnostics
        run: lua tests/recovery_test.lua
      - name: Player 0.18 local failure logging
        run: lua tests/error_report_test.lua
      - name: Player 0.18 larger-scene stress and interpolation regression
        run: lua tests/stress_player_test.lua
      - name: Player 0.19 audio voice pool and independent channel tests
        run: lua tests/audio_mixer_test.lua
      - name: Player 0.20 Windows executable packager unit tests
        run: python3 tests/windows_package_test.py
      - name: Player 0.21 native file imports and CLI arguments
        run: lua tests/file_import_test.lua
      - name: Player 0.22 native Windows dialog guards and icon
        run: lua tests/native_dialog_test.lua
      - name: Player 0.23 responsive 600x380 to full-HD geometry
        run: lua tests/responsive_test.lua
      - name: Player 0.23 Windows PE icon resource validation
        run: python3 tests/windows_resource_test.py
      - name: Player 0.24 accessible focus and keyboard navigation
        run: lua tests/focus_nav_test.lua
      - name: Player 0.25 complete editor keyboard focus
        run: lua tests/editor_nav_test.lua
      - name: Player 0.25 persistent visual accessibility settings
        run: lua tests/visual_settings_test.lua
      - name: Player 0.26 font sizes and Unicode-safe label fitting
        run: lua tests/text_scale_test.lua
      - name: Player 0.26 20-minute synthetic playback endurance regression
        run: lua tests/endurance_player_test.lua
      - name: Player 0.27 indexed cached vector renderer and correctness
        run: lua tests/render_cache_test.lua
      - name: Player 0.27 bounded CPU render/update profiler
        run: lua tests/perf_monitor_test.lua
      - name: Player 0.28 viewport culling, drawing and compact scissor correctness
        run: lua tests/viewport_renderer_test.lua
      - name: Player 0.28 interpolated compatibility preindex and safe reindex
        run: lua tests/interpolation_segments_test.lua
      - name: Player 0.28 crowded 11.5k-shape culling stress and draw-call comparison
        run: lua tests/culling_stress_test.lua
      - name: Studio to Player native project round-trip
        run: lua tests/studio_player_roundtrip_test.lua
      - name: Studio 0.2 project and layer lifecycle regression
        run: lua tests/studio_edit_test.lua
      - name: Studio Flash exposure spans and blank frame compatibility
        run: lua tests/studio_spans_test.lua
      - name: Studio Flash symbols and instance sidecar regression
        run: lua tests/studio_symbols_test.lua
      - name: Studio atomic artwork and symbol timeline transactions
        run: lua tests/studio_timeline_ops_test.lua
      - name: Studio Graphic MovieClip Button playback and interaction
        run: lua tests/studio_symbol_motion_test.lua
      - name: Studio symbol instance transforms and LUALIB compatibility
        run: lua tests/studio_instance_transform_test.lua
      - name: Studio mouse transform handles and numeric property limits
        run: lua tests/studio_instance_handles_test.lua
      - name: Studio multi-instance alignment and group operations
        run: lua tests/studio_instance_group_test.lua
      - name: Studio marquee selection and group property validation
        run: lua tests/studio_marquee_test.lua
      - name: Studio Bezier vector paths and authoring persistence
        run: lua tests/studio_vector_paths_test.lua
      - name: Player and Studio interface smoke tests
        run: lua tests/gui_smoke.lua
      - name: Real LÖVE graphical/media smoke test (virtual display)
        run: xvfb-run -a env SDL_AUDIODRIVER=dummy LIBGL_ALWAYS_SOFTWARE=1 LUA_FLASH_SMOKE=1 LUA_FLASH_SMOKE_MEDIA=1 timeout 30s love player-lua
      - name: Package standalone Player .love and example .lfgame
        run: |
          python3 tools/package_player.py
          lua tools/export_example.lua dist/Exemplo-0.28.lfgame
          lua -e 'package.path="./player-lua/?.lua;"..package.path; local d=require("src.demo").create(); local f=assert(io.open("dist/cena-teste.lflash","wb")); assert(f:write(require("src.model").encode(d))); assert(f:close())'
          lua tools/make_game.lua dist/cena-teste.lflash dist/Criado-0.28.lfgame 2 1 5 20 smooth
          lua -e 'package.path="./player-lua/?.lua;"..package.path; local f=assert(io.open("dist/Criado-0.28.lfgame","rb")); local g=assert(require("src.package_v3").decode(f:read("*a"))); f:close(); assert(g.version==3 and g.goal==5 and g.duration==20 and #g.rules==1 and #g.bindings>0)'
          python3 tools/generate_media_fixtures.py --directory dist
          lua tools/attach_media.lua dist/Criado-0.28.lfgame dist/Com-Midia-0.28.lfgame dist/icone-original.png 660 270 64 64 dist/efeito-original.wav CLICKID alvo
          lua -e 'package.path="./player-lua/?.lua;"..package.path; local f=assert(io.open("dist/Com-Midia-0.28.lfgame","rb")); local game=assert(require("src.package_v4").decode(f:read("*a"))); f:close(); assert(game.version==4 and #game.resources==2 and #game.cues==1 and #game.sprites==1)'
          lua tools/bind_sprite.lua dist/Com-Midia-0.28.lfgame dist/Com-Sprite-0.28.lfgame 1 alvo FOLLOW
          lua -e 'package.path="./player-lua/?.lua;"..package.path; local f=assert(io.open("dist/Com-Sprite-0.28.lfgame","rb")); local game=assert(require("src.package_v5").decode(f:read("*a"))); f:close(); assert(game.version==5 and #game.spriteBindings==1 and game.spriteBindings[1].id=="alvo")'
          lua tools/animate_media.lua dist/Com-Sprite-0.28.lfgame dist/Animado-0.28.lfgame 1 7 dist/icone-original.png som_1 23
          lua -e 'package.path="./player-lua/?.lua;"..package.path; local f=assert(io.open("dist/Animado-0.28.lfgame","rb")); local g=assert(require("src.package_v6").decode(f:read("*a"))); f:close(); assert(g.version==6 and #g.animations==1 and #g.timelineSounds==1)'
          lua tools/transform_sprite.lua dist/Animado-0.28.lfgame dist/Transformado-0.28.lfgame 1 45 130 130 50 50
          lua -e 'package.path="./player-lua/?.lua;"..package.path; local f=assert(io.open("dist/Transformado-0.28.lfgame","rb")); local g=assert(require("src.package_v7").decode(f:read("*a"))); f:close(); assert(g.version==7 and #g.transforms==1 and g.transforms[1].angle==45)'
          lua tools/animate_transform.lua dist/Transformado-0.28.lfgame dist/Com-Keyframes-0.28.lfgame 1 1,0,0,0,100,100 23,30,-45,90,150,85 45,-20,30,180,75,150 90,0,0,360,100,100
          lua -e 'package.path="./player-lua/?.lua;"..package.path; local f=assert(io.open("dist/Com-Keyframes-0.28.lfgame","rb")); local g=assert(require("src.package_v8").decode(f:read("*a"))); f:close(); assert(g.version==8 and #g.tweens==1 and #g.tweens[1].keys==4)'
          lua tools/set_easing.lua dist/Com-Keyframes-0.28.lfgame dist/Com-Easing-0.28.lfgame 1 1 EASE_IN_OUT
          lua -e 'package.path="./player-lua/?.lua;"..package.path; local f=assert(io.open("dist/Com-Easing-0.28.lfgame","rb")); local g=assert(require("src.package_v9").decode(f:read("*a"))); f:close(); assert(g.version==9 and #g.easings==1 and g.easings[1].mode=="EASE_IN_OUT")'
      - name: Real LÖVE 640x400 compact and HiDPI layout smoke test
        run: xvfb-run -a env SDL_AUDIODRIVER=dummy LIBGL_ALWAYS_SOFTWARE=1 LUA_FLASH_SMOKE=1 LUA_FLASH_SMOKE_COMPACT=1 timeout 30s love player-lua
      - name: Real LÖVE startup with native .lfgame command-line argument
        run: xvfb-run -a env SDL_AUDIODRIVER=dummy LIBGL_ALWAYS_SOFTWARE=1 LUA_FLASH_SMOKE=1 LUA_FLASH_SMOKE_CLI=1 timeout 30s love player-lua dist/Exemplo-0.28.lfgame
      - name: Package standalone Studio 0.2 .love
        run: python3 tools/package_studio.py
      - name: Upload Studio editor test build
        uses: actions/upload-artifact@v4
        with:
          name: lua-flash-studio-0.2-love
          path: dist/Lua-Flash-Studio-0.2.love
          if-no-files-found: error
      - name: Upload Player test build
        uses: actions/upload-artifact@v4
        with:
          name: lua-flash-player-0.28-love-and-game
          path: |
            dist/Lua-Flash-Player-0.28.love
            dist/Exemplo-0.28.lfgame
            dist/Criado-0.28.lfgame
            dist/Com-Midia-0.28.lfgame
            dist/Com-Sprite-0.28.lfgame
            dist/Animado-0.28.lfgame
            dist/Transformado-0.28.lfgame
            dist/Com-Keyframes-0.28.lfgame
            dist/Com-Easing-0.28.lfgame
            dist/icone-original.png
            dist/efeito-original.wav
          if-no-files-found: error

  windows:
    name: Windows x64 portable .exe
    needs: lua
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified Player .love from Linux tests
        uses: actions/download-artifact@v4
        with:
          name: lua-flash-player-0.28-love-and-game
          path: dist
      - name: Get official LÖVE 11.5 Windows x64 archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ".cache" | Out-Null
          $url = "https://github.com/love2d/love/releases/download/11.5/love-11.5-win64.zip"
          Invoke-WebRequest -Uri $url -OutFile ".cache/love-11.5-win64.zip"
          $expected = "BA6E56BE2685E53C817749C4A5007F51137136FE5A3AB64920508BABC2E74369"
          $actual = (Get-FileHash ".cache/love-11.5-win64.zip" -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "LÖVE ZIP SHA256 did not match official pinned release" }
      - name: Package self-contained Player Windows x64
        shell: pwsh
        run: |
          python tools/package_player_windows.py --love-zip ".cache/love-11.5-win64.zip" --game "dist/Lua-Flash-Player-0.28.love" --output "dist/Lua-Flash-Player-0.28-Windows-x64.zip"
          if ($LASTEXITCODE -ne 0) { throw "Windows package step failed" }
          python tests/windows_package_test.py
          if ($LASTEXITCODE -ne 0) { throw "Windows packaging tests failed" }
      - name: Check fused native Windows executable and bundled DLLs
        shell: pwsh
        run: |
          Expand-Archive -Path "dist/Lua-Flash-Player-0.28-Windows-x64.zip" -DestinationPath ".cache/win" -Force
          $folder = ".cache/win/Lua-Flash-Player-0.28-Windows-x64"
          $exe = Join-Path $folder "Lua-Flash-Player.exe"
          if (!(Test-Path $exe)) { throw "Windows executable was not extracted" }
          $icoFile = Join-Path $folder "Lua-Flash-Player.ico"
          if (!(Test-Path $icoFile)) {
            throw "Original Lua-Flash icon is missing"
          }
          $dlls = @(Get-ChildItem -Path $folder -Filter "*.dll")
          if ($dlls.Count -eq 0) { throw "Windows runtime DLLs are missing" }
          $data = [IO.File]::ReadAllBytes((Resolve-Path $exe).Path)
          if ($data[0] -ne 77 -or $data[1] -ne 90) { throw "Missing Windows PE header" }
          if ($data.Length -lt 100000) { throw "Fused executable is too small" }
          $version = (Get-Item $exe).VersionInfo
          if ($version.FileVersion -ne "0.28.0.0" -or
              $version.ProductName -ne "Lua-Flash Player") {
            throw "Windows EXE metadata missing: $($version.FileVersion), $($version.ProductName)"
          }
          python tools/windows_resources.py --verify $exe $icoFile
          if ($LASTEXITCODE -ne 0) { throw "Fused EXE does not contain original Lua-Flash PE icon" }
          Write-Host "Fused Windows executable validated with embedded custom PE icon and $($dlls.Count) DLLs."
      - name: Verify native Windows executable launches
        shell: pwsh
        run: |
          $exe = Join-Path (Resolve-Path ".cache/win/Lua-Flash-Player-0.28-Windows-x64").Path "Lua-Flash-Player.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--version" -PassThru
          if (-not $process.WaitForExit(15000)) {
            Stop-Process -Id $process.Id -Force
            throw "Native LÖVE executable did not exit after --version"
          }
          if ($process.ExitCode -ne 0) {
            throw "Native Windows executable failed to start; exit=$($process.ExitCode)"
          }
          Write-Host "Windows bundled LÖVE native process started and exited correctly."
      - name: Native Win32 Unicode file read and graphical startup smoke
        shell: pwsh
        run: |
          $exe = Join-Path (Resolve-Path ".cache/win/Lua-Flash-Player-0.28-Windows-x64").Path "Lua-Flash-Player.exe"
          $game = Join-Path $env:TEMP "LuaFlash-Áudio.lfgame"
          Copy-Item "dist/Exemplo-0.28.lfgame" $game
          $marker = Join-Path $env:TEMP "lua-flash-native-smoke-ok.txt"
          Remove-Item $marker -ErrorAction SilentlyContinue
          $env:LUA_FLASH_SMOKE_WIN_NATIVE = "1"
          $env:LUA_FLASH_SMOKE_WIN_NATIVE_OKFILE = $marker
          $p = Start-Process -FilePath $exe -PassThru
          if (-not $p.WaitForExit(15000)) {
            Stop-Process -Id $p.Id -Force
            throw "Player Windows headless Win32 import timed out"
          }
          if (-not (Test-Path $marker) -or
              (Get-Content $marker -Raw) -ne "LUAF_WIN_NATIVE_OK") {
            throw "Win32 UTF-16 file import did not verify in the Player"
          }
          if ($p.ExitCode -ne 0) { throw "Windows Player closed with error $($p.ExitCode)" }
          Write-Host "Windows native Unicode filename imported into the fused Player."
      - name: Upload portable Windows 64-bit build
        uses: actions/upload-artifact@v4
        with:
          name: lua-flash-player-0.28-windows-x64-portable
          path: dist/Lua-Flash-Player-0.28-Windows-x64.zip
          if-no-files-found: error
